
name: Build Assamese Sahayika APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        shell: bash
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html not found"
            exit 1
          fi
          echo "HTML file found."

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::error::Android SDK sdkmanager not found"
            exit 1
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Capacitor project
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install --save-exact \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rbg.assamesesahayika",
            "appName": "Assamese Sahayika",
            "webDir": "www"
          }
          EOF
          fi

          mkdir -p www
          cp index.html www/index.html

          for item in assets css js images; do
            if [ -e "$item" ]; then
              cp -R "$item" www/
            fi
          done

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Add Android microphone permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          content = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO"
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in content:
                  content = content.replace(
                      "<application",
                      f"    {tag}\n    <application",
                      1
                  )

          manifest.write_text(content, encoding="utf-8")
          print("Manifest permissions added.")
          PY

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify microphone permission
        shell: bash
        run: |
          grep -n "RECORD_AUDIO" \
            android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew --no-daemon bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Assamese-Sahayika-APK-AAB
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
