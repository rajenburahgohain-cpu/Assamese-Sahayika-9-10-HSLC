<body>

</section>

অসমীয়া সহায়িকা • 9 • 10 • HSLC

<script>

/* =====================================================
   SUPABASE CONNECTION

   ⚠️ নিজৰ Supabase Project URL আৰু Publishable Key বহুৱাওক।

   URL-ৰ শেষত /rest/v1/ দিব নালাগে।
===================================================== */

const SUPABASE_URL =
"https://YOUR_PROJECT_ID.supabase.co";

const SUPABASE_KEY =
"YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   CHAPTERS
===================================================== */

const chapters = {

"9":[

"শিশুলীলা",
"মানৱ বন্দনা",
"গীত আৰু ছবি",
"প্ৰচণ্ড ধুমুহাই প্ৰশ্ন কৰিলে মোক",
"মোৰ দেশ",

"অনন্য প্ৰতি ব্যৱহাৰ",
"সময়",
"অন্ধবিশ্বাস আৰু কু-সংস্কাৰ",
"ভাৰতৰ বৈচিত্ৰ্য মাজত ঐক্য",
"পোহৰৰ বাটেৰে আগবঢ়া গাঁওখন",
"যুঁজ",
"লোকসংস্কৃতি",

"হনুমন্তৰ লংকাশমন",
"সুখ",
"চোৰধৰা",
"সন্মান"

],

"10":[

"বৰগীত",
"জিকিৰ",
"প্ৰশস্তি",
"মই অসমীয়া",
"দৃশ্যান্তৰ",

"উদ্যোগী হওঁ আহা",

"অসমৰ জনগোষ্ঠীৰ গাঁথনি আৰু সংস্কৃতি",

"অকণমানি সিহঁত",

],

"HSLC":[

"অসমীয়া পাঠ্যপুথি",
"অসমীয়া ব্যাকৰণ",
"HSLC প্ৰশ্নোত্তৰ",
"HSLC মডেল প্ৰশ্ন",
"HSLC পৰীক্ষাৰ প্ৰস্তুতি"

]

};


/* =====================================================
   GRAMMAR
===================================================== */

const grammar = [

["সন্ধি","সন্ধিৰ নিয়ম আৰু উদাহৰণ"],
["সমাস","সমাসৰ নিয়ম আৰু উদাহৰণ"],
["উপসৰ্গ","উপসৰ্গৰ পৰিচয় আৰু প্ৰয়োগ"],
["প্ৰত্যয়","প্ৰত্যয়ৰ নিয়ম আৰু উদাহৰণ"],
["সমাৰ্থক শব্দ","একেটা অৰ্থ প্ৰকাশ কৰা শব্দ"],
["বিপৰীত শব্দ","বিপৰীত অৰ্থ প্ৰকাশ কৰা শব্দ"],
["জতুৱা ঠাঁচ","জতুৱা ঠাঁচৰ অৰ্থ আৰু প্ৰয়োগ"],
["বাক্য পৰিৱৰ্তন","বাক্য পৰিৱৰ্তনৰ নিয়ম"],
["যতি চিন","যতি চিহ্নৰ ব্যৱহাৰ"],
["ৰচনা আৰু লিখন","ৰচনা, আবেদন আৰু প্ৰতিবেদন"]
];


/* =====================================================
   PAGE CONTROL
===================================================== */

let currentClass = "9";

function showOnly(id){

  [
    "homePage",
    "chapterPage",
    "grammarPage",
    "toolsPage"
  ].forEach(x => {

    const el = document.getElementById(x);

    if(el){
      el.classList.toggle("hidden",x !== id);
    }

  });

  window.scrollTo(0,0);
}


function goHome(){

  showOnly("homePage");

  renderChapters(currentClass);
}


/* =====================================================
   CLASS
===================================================== */

function showClass(cls,btn){

  currentClass = cls;

  document.querySelectorAll(".tab")
    .forEach(x => x.classList.remove("active"));

  if(btn){
    btn.classList.add("active");
  }

  showOnly("homePage");

  renderChapters(cls);
}


/* =====================================================
   RENDER CHAPTERS
===================================================== */

function renderChapters(cls){

  const box =
    document.getElementById("homeContent");

  const list =
    chapters[cls] || [];

  let html = `
    <div class="card">
      <h2>📚 ${
        cls === "HSLC"
        ? "HSLC"
        : cls + " নম্বৰ শ্ৰেণী"
      }</h2>

      <p>তলৰ পাঠটোত Click কৰক।</p>
  `;

  if(list.length === 0){

    html += `
      <p>এতিয়াও পাঠ যোগ কৰা হোৱা নাই।</p>
    `;

  }else{

    list.forEach((name,index)=>{

      html += `
        <button
          class="chapter"
          onclick="openChapter('${escapeJS(cls)}','${escapeJS(name)}')"
        >
          📖 ${index+1}. ${escapeHTML(name)}
        </button>
      `;

    });

  }

  html += `</div>`;

  box.innerHTML = html;
}


/* =====================================================
   OPEN CHAPTER
===================================================== */

async function openChapter(cls,chapterName){

  showOnly("chapterPage");

  document.getElementById("chapterClass")
    .textContent =
      cls === "HSLC"
      ? "HSLC"
      : cls + " নম্বৰ শ্ৰেণী";

  document.getElementById("chapterTitle")
    .textContent = chapterName;

  const box =
    document.getElementById("chapterContent");

  box.innerHTML =
    `<div class="loader">
      ⏳ "${escapeHTML(chapterName)}" ৰ প্ৰশ্নোত্তৰ লোড হৈছে...
    </div>`;


  /* Database-ৰ পৰা questions আনিব */

  try{

    const result =
      await supabaseClient
        .from("questions")
        .select("*")
        .eq("class_name",cls)
        .eq("chapter_name",chapterName)
        .order("id",{ascending:true});


    const data = result.data;
    const error = result.error;


    if(error){

      console.error(error);

      box.innerHTML = `
        <div class="question">
          <h3>⚠️ Database সংযোগ সমস্যা</h3>

          <p>
          Supabase URL আৰু Publishable Key ঠিক আছে নে পৰীক্ষা কৰক।
          </p>
        </div>
      `;

      return;
    }


    if(!data || data.length === 0){

      box.innerHTML = `
        <div class="question">

          <h3>📚 ${escapeHTML(chapterName)}</h3>

          <p>
          এই পাঠৰ প্ৰশ্নোত্তৰ Database-ত এতিয়াও
          যোগ কৰা হোৱা নাই।
          </p>

          <p>
          Supabase-ৰ <b>questions</b> table-ত
          এই পাঠৰ প্ৰশ্ন আৰু উত্তৰ যোগ কৰক।
          </p>

        </div>
      `;

      return;
    }


    /* Questions দেখুৱাব */

    box.innerHTML = data.map((q,i)=>{

      return `
        <div class="question">

          <span class="badge">
            প্ৰশ্ন ${i+1}
          </span>

          <h3>
            ${escapeHTML(
              q.question || ""
            )}
          </h3>

          <div class="answer">
            <b>উত্তৰ:</b><br>
            ${formatAnswer(q.answer || "")}
          </div>

        </div>
      `;

    }).join("");


  }catch(err){

    console.error(err);

    box.innerHTML = `
      <div class="question">
        <h3>⚠️ Error</h3>
        <p>প্ৰশ্নোত্তৰ লোড কৰিব পৰা নগ'ল।</p>
      </div>
    `;

  }

}


/* =====================================================
   GRAMMAR
===================================================== */

function showGrammar(){

  showOnly("grammarPage");

  const box =
    document.getElementById("grammarList");

  box.innerHTML =
    grammar.map((g,i)=>{

      return `
        <button
          class="chapter"
          onclick="openGrammar('${escapeJS(g[0])}')"
        >
          📖 ${i+1}. ${escapeHTML(g[0])}

          <br>

          <small>
            ${escapeHTML(g[1])}
          </small>

        </button>
      `;

    }).join("");

}


async function openGrammar(grammarName){

  showOnly("chapterPage");

  document.getElementById("chapterClass")
    .textContent = "অসমীয়া ব্যাকৰণ";

  document.getElementById("chapterTitle")
    .textContent = grammarName;

  const box =
    document.getElementById("chapterContent");

  box.innerHTML =
    `<div class="loader">
      ⏳ ব্যাকৰণৰ প্ৰশ্নোত্তৰ লোড হৈছে...
    </div>`;


  try{

    const result =
      await supabaseClient
        .from("questions")
        .select("*")
        .eq("class_name","Grammar")
        .eq("chapter_name",grammarName)
        .order("id",{ascending:true});


    if(result.error){

      console.error(result.error);

      box.innerHTML = `
        <div class="question">
          <h3>⚠️ Database Error</h3>
          <p>ব্যাকৰণৰ প্ৰশ্নোত্তৰ আনিব পৰা নগ'ল।</p>
        </div>
      `;

      return;
    }


    if(!result.data || result.data.length === 0){

      box.innerHTML = `
        <div class="question">

          <h3>📖 ${escapeHTML(grammarName)}</h3>

          <p>
          এই বিষয়ৰ প্ৰশ্নোত্তৰ এতিয়াও
          Database-ত যোগ কৰা হোৱা নাই।
          </p>

        </div>
      `;

      return;
    }


    box.innerHTML =
      result.data.map((q,i)=>`

        <div class="question">

          <span class="badge">
            প্ৰশ্ন ${i+1}
          </span>

          <h3>${escapeHTML(q.question || "")}</h3>

          <div class="answer">
            <b>উত্তৰ:</b><br>
            ${formatAnswer(q.answer || "")}
          </div>

        </div>

      `).join("");


  }catch(err){

    console.error(err);

    box.innerHTML =
      `<div class="question">
        ⚠️ Error হৈছে।
      </div>`;

  }

}


/* =====================================================
   SHARE
===================================================== */

async function shareApp(){

  const shareData = {

    title:"অসমীয়া সহায়িকা-9&10+HSLC",

    text:
      "নৱম, দশম আৰু HSLC পৰীক্ষাৰ বাবে অসমীয়া সহায়িকা App",

    url:window.location.href

  };


  try{

    if(navigator.share){

      await navigator.share(shareData);

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert("App Link Copy হৈছে।");

    }

  }catch(e){

    console.log(e);

  }

}


/* =====================================================
   REFERRAL
===================================================== */

function makeReferralCode(){

  let code =
    localStorage.getItem("referralCode");

  if(!code){

    code =
      "ASSAM" +
      Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();

    localStorage.setItem(
      "referralCode",
      code
    );

  }

  return code;
}


function showTools(){

  showOnly("toolsPage");

  document.getElementById("refCode")
    .textContent =
      makeReferralCode();

}


async function copyReferral(){

  const code =
    document.getElementById("refCode")
      .textContent;

  try{

    await navigator.clipboard
      .writeText(code);

    alert(
      "Referral Code Copy হৈছে: " +
      code
    );

  }catch(e){

    alert(code);

  }

}


/* =====================================================
   SEARCH
===================================================== */

function searchAll(){

  const text =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  if(!text){

    renderChapters(currentClass);

    return;

  }


  const list =
    chapters[currentClass] || [];

  const found =
    list.filter(x =>
      x.toLowerCase()
       .includes(text)
    );


  const box =
    document.getElementById("homeContent");


  box.innerHTML = `
    <div class="card">

      <h2>🔎 Search Result</h2>

      ${
        found.length
        ? found.map((x,i)=>`

          <button
            class="chapter"
            onclick="openChapter('${escapeJS(currentClass)}','${escapeJS(x)}')"
          >
            📖 ${escapeHTML(x)}
          </button>

        `).join("")
        : "<p>কোনো পাঠ পোৱা নগ'ল।</p>"
      }

    </div>
  `;

}


/* =====================================================
   SECURITY / DISPLAY HELPERS
===================================================== */

function escapeHTML(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJS(str){

  return String(str)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}


function formatAnswer(str){

  return escapeHTML(str)
    .replace(/\n/g,"<br>");

}


/* =====================================================
   START APP
===================================================== */

renderChapters("9");

</script>

</body>
</html>
