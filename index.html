<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>অসমীয়া সহায়িকা-9&10+HSLC</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#075e54,#1565c0);
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{
  font-size:25px;
  margin-bottom:8px;
}

header p{
  font-size:16px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:15px;
}

.search{
  background:white;
  padding:15px;
  margin:15px 0;
  border-radius:18px;
}

.search input{
  width:100%;
  padding:14px;
  border:2px solid #075e54;
  border-radius:25px;
  font-size:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #0001;
}

.card h2{
  margin-bottom:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  margin:5px 3px;
  font-size:15px;
  cursor:pointer;
}

.primary{
  background:#075e54;
  color:white;
}

.blue{
  background:#1565c0;
  color:white;
}

.orange{
  background:#ef6c00;
  color:white;
}

.gray{
  background:#e9eef5;
  color:#172033;
}

.chapter{
  display:block;
  width:100%;
  text-align:left;
  background:#f5f7fa;
  border-left:5px solid #075e54;
  margin:8px 0;
}

.question{
  background:#f7f9fc;
  border-left:5px solid #1565c0;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

.tag{
  display:inline-block;
  background:#e3f2fd;
  color:#075e54;
  padding:5px 8px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:13px;
}

.hidden{
  display:none;
}

.refbox{
  background:#fff8e1;
  border-left:5px solid #ff9800;
}

.refcode{
  font-size:20px;
  font-weight:bold;
  padding:10px;
  background:white;
  border-radius:10px;
  text-align:center;
  margin:10px 0;
}

footer{
  text-align:center;
  padding:25px;
  color:#666;
}
</style>
</head>

<body>

<header>
<h1>📚 অসমীয়া সহায়িকা-9&10+HSLC</h1>
<p>নৱম • দশম • HSLC • AI Study Assistant</p>
</header>

<div class="container">

<div class="search">
<input
  id="searchBox"
  type="search"
  placeholder="🔎 বিষয় বা প্ৰশ্ন Search কৰক"
  oninput="searchContent()">
</div>

<div id="home">

<div class="card">
<h2>📚 অধ্যয়নৰ শাখা</h2>

<div class="grid">

<button class="primary" onclick="loadChapters(1,'নৱম শ্ৰেণী')">
📘 নৱম শ্ৰেণী
</button>

<button class="primary" onclick="loadChapters(2,'দশম শ্ৰেণী')">
📗 দশম শ্ৰেণী
</button>

<button class="blue" onclick="loadChapters(3,'HSLC')">
🎓 HSLC
</button>

</div>
</div>


<div class="card">
<h2>🤖 AI Study Assistant</h2>

<input
 id="aiQuestion"
 style="width:100%;padding:13px;border:1px solid #ccc;border-radius:10px"
 placeholder="আপোনাৰ প্ৰশ্ন লিখক">

<button class="blue" onclick="askAI()">
🤖 উত্তৰ বিচাৰক
</button>

<div id="aiResult"></div>
</div>


<div class="card refbox">
<h2>🎁 Referral & Share</h2>

<p>
আপোনাৰ Referral Code বন্ধুক Share কৰক।
</p>

<div class="refcode" id="refCode">
Loading...
</div>

<button class="orange" onclick="copyReferral()">
📋 Referral Code Copy
</button>

<button class="blue" onclick="shareApp()">
📤 App Share
</button>

<div id="shareResult"></div>
</div>

</div>


<!-- CHAPTER PAGE -->

<div id="chapterPage" class="hidden">

<button class="gray" onclick="goHome()">← Home</button>

<div class="card">
<h2 id="classTitle"></h2>

<div id="chapterList">
<p>⏳ Database-ৰ পৰা পাঠসমূহ Loading...</p>
</div>
</div>

</div>


<!-- QUESTION PAGE -->

<div id="questionPage" class="hidden">

<button class="gray" onclick="backToChapters()">
← পাঠসমূহ
</button>

<div class="card">
<h2 id="chapterTitle"></h2>

<div id="questionList">
<p>⏳ প্ৰশ্নোত্তৰ Loading...</p>
</div>
</div>

</div>

</div>


<footer>
অসমীয়া সহায়িকা • 9 • 10 • HSLC
</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================
   SUPABASE CONNECTION
   ===================================== */

/*
  ⚠️ নিজৰ Supabase URL আৰু Publishable key
  ইয়াত বসাওক।
*/

const SUPABASE_URL = "https://rlmxfzdbipksbrikgfbs.supabase.co";

const SUPABASE_KEY = "sb_publishable_YbXRYD3badwrI6iUh3IFJg_k_efMjen";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   PAGE CONTROL
   ===================================== */

function showOnly(id){

  document
    .querySelectorAll(".container > div")
    .forEach(x => {

      if(
        x.id === "home" ||
        x.id === "chapterPage" ||
        x.id === "questionPage"
      ){
        x.classList.add("hidden");
      }

    });

  document
    .getElementById(id)
    .classList.remove("hidden");

  window.scrollTo(0,0);
}


function goHome(){

  showOnly("home");

}


function backToChapters(){

  showOnly("chapterPage");

}


/* =====================================
   LOAD CHAPTERS
   ===================================== */

async function loadChapters(classId,className){

  showOnly("chapterPage");

  document.getElementById("classTitle").innerText =
    "📚 " + className;

  const list =
    document.getElementById("chapterList");

  list.innerHTML =
    "<p>⏳ Database-ৰ পৰা পাঠসমূহ Loading...</p>";

  try{

    const {data,error} =
      await supabaseClient
      .from("chapters")
      .select("id,title,description")
      .eq("class_id",classId)
      .order("id");

    if(error){

      console.error(error);

      list.innerHTML =
      "<div class='question'>❌ Database error হৈছে।</div>";

      return;
    }


    if(!data || data.length === 0){

      list.innerHTML =
      "<div class='question'>📚 এই শ্ৰেণীৰ কোনো পাঠ এতিয়াও Database-ত যোগ কৰা হোৱা নাই।</div>";

      return;
    }


    list.innerHTML = data.map(chapter => `

      <button
        class="chapter"
        onclick="loadQuestions(${chapter.id},${escapeJS(chapter.title)})">

        <b>📖 ${escapeHTML(chapter.title)}</b>

        <br>

        <small>
        ${escapeHTML(chapter.description || "")}
        </small>

      </button>

    `).join("");

  }

  catch(err){

    console.error(err);

    list.innerHTML =
    "<div class='question'>❌ Connection error হৈছে।</div>";

  }

}


/* =====================================
   LOAD QUESTIONS
   ===================================== */

async function loadQuestions(chapterId,title){

  showOnly("questionPage");

  document.getElementById("chapterTitle").innerText =
    "📖 " + title;

  const list =
    document.getElementById("questionList");

  list.innerHTML =
    "<p>⏳ প্ৰশ্নোত্তৰ Loading...</p>";


  try{

    const {data,error} =
      await supabaseClient
      .from("questions")
      .select("*")
      .eq("chapter_id",chapterId)
      .order("id");


    if(error){

      console.error(error);

      list.innerHTML =
      "<div class='question'>❌ Questions Database error হৈছে।</div>";

      return;
    }


    if(!data || data.length === 0){

      list.innerHTML =
      "<div class='question'>📝 এই পাঠৰ প্ৰশ্নোত্তৰ এতিয়াও Database-ত যোগ কৰা হোৱা নাই।</div>";

      return;
    }


    list.innerHTML = data.map((q,i) => `

      <div class="question">

        <span class="tag">
        ${escapeHTML(q.question_type || "প্ৰশ্ন")}
        </span>

        <h3>
        ${i+1}. ${escapeHTML(q.question || "")}
        </h3>

        <p style="margin-top:10px">

        <b>উত্তৰ:</b><br>

        ${escapeHTML(q.answer || "উত্তৰ এতিয়াও যোগ কৰা হোৱা নাই।")}

        </p>

      </div>

    `).join("");

  }

  catch(err){

    console.error(err);

    list.innerHTML =
    "<div class='question'>❌ Connection error হৈছে।</div>";

  }

}


/* =====================================
   SEARCH
   ===================================== */

function searchContent(){

  const text =
    document
    .getElementById("searchBox")
    .value
    .trim()
    .toLowerCase();

  if(!text){

    document
      .querySelectorAll(".question")
      .forEach(x =>
        x.style.display=""
      );

    return;
  }

  document
    .querySelectorAll(".question")
    .forEach(x => {

      const value =
        x.innerText.toLowerCase();

      x.style.display =
        value.includes(text)
        ? ""
        : "none";

    });

}


/* =====================================
   AI BASIC ASSISTANT
   ===================================== */

function askAI(){

  const q =
    document
    .getElementById("aiQuestion")
    .value
    .trim()
    .toLowerCase();

  const result =
    document.getElementById("aiResult");


  if(!q){

    result.innerHTML =
    "<div class='question'>✏️ প্ৰথমে প্ৰশ্ন লিখক।</div>";

    return;
  }


  let answer =
  "এই প্ৰশ্নটোৰ AI উত্তৰ Backend AI সংযোগ কৰাৰ পিছত ইয়াত দেখা যাব।";


  if(q.includes("সন্ধি")){

    answer =
    "সন্ধি হৈছে দুটা ধ্বনি বা শব্দৰ মিলনত হোৱা ধ্বনিগত পৰিৱৰ্তন।";

  }

  else if(q.includes("সমাৰ্থক")){

    answer =
    "সমাৰ্থক শব্দ হৈছে একে বা ওচৰা-ওচৰি অৰ্থ প্ৰকাশ কৰা শব্দ।";

  }

  else if(q.includes("বিপৰীত")){

    answer =
    "বিপৰীত শব্দে বিপৰীত অৰ্থ প্ৰকাশ কৰে।";

  }


  result.innerHTML = `

  <div class="question">

  <b>🤖 উত্তৰ:</b>

  <p style="margin-top:8px">
  ${escapeHTML(answer)}
  </p>

  </div>

  `;

}


/* =====================================
   REFERRAL CODE
   ===================================== */

function createReferralCode(){

  let code =
    localStorage.getItem("rbg_referral_code");


  if(!code){

    const random =
      Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

    code = "RBG-" + random;

    localStorage.setItem(
      "rbg_referral_code",
      code
    );

  }


  document
    .getElementById("refCode")
    .innerText = code;

}


function copyReferral(){

  const code =
    document
    .getElementById("refCode")
    .innerText;

  navigator.clipboard
    .writeText(code)
    .then(() => {

      document
      .getElementById("shareResult")
      .innerText =
      "✅ Referral Code Copy হৈছে।";

    });

}


/* =====================================
   APP SHARE
   ===================================== */

async function shareApp(){

  const code =
    document
    .getElementById("refCode")
    .innerText;

  const shareText =
`📚 অসমীয়া সহায়িকা-9&10+HSLC

নৱম • দশম • HSLC পৰীক্ষাৰ বাবে সহায়িকা।

🎁 মোৰ Referral Code:
${code}

📱 App:
${window.location.href}`;


  if(navigator.share){

    try{

      await navigator.share({

        title:
        "অসমীয়া সহায়িকা-9&10+HSLC",

        text:
        shareText,

        url:
        window.location.href

      });

    }

    catch(err){}

  }

  else{

    await navigator.clipboard
      .writeText(shareText);

    document
      .getElementById("shareResult")
      .innerText =
      "✅ Share message Copy হৈছে। WhatsApp-ত Paste কৰক।";

  }

}


/* =====================================
   SECURITY HELPERS
   ===================================== */

function escapeHTML(str){

  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJS(str){

  return JSON.stringify(
    String(str ?? "")
  );

}


/* =====================================
   START
   ===================================== */

createReferralCode();

showOnly("home");

</script>

</body>
</html>
