name: Build Assamese Sahayika APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check project files
        shell: bash
        run: |
          echo "Repository files:"
          ls -la
          test -f index.html || { echo "::error::index.html not found in repository root"; exit 1; }

      - name: Prepare Capacitor project
        shell: bash
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install --save-exact @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rbg.assamesesahayika",
            "appName": "Assamese Sahayika",
            "webDir": "www"
          }
          EOF
          fi
          mkdir -p www
          cp index.html www/index.html
          for item in assets css js images; do
            if [ -e "$item" ]; then cp -R "$item" www/; fi
          done
          npx cap add android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Assamese-Sahayika-APK-AAB
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
